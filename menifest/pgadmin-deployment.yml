apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.7

          ports:
            - containerPort: 80

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "nsn.kapil@gmail.com"

            - name: PGADMIN_DEFAULT_PASSWORD
              value: "Admin123"

            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "True"

            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "False"