apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17.10-trixie
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "Admin"
        - name: POSTGRES_PASSWORD
          value: "Adminuser@123"
        - name: POSTGRES_DB
          value: "axiondb"